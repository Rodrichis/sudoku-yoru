<style>
        body {
            background-color: #1E1E1E;
            color: #F5F1ED;
            -webkit-tap-highlight-color: transparent;
        }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border: 1.5px solid #45474c;
        }
        .cell {
            border: 0.5px solid #45474c;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .cell-active {
            background-color: rgba(190, 199, 220, 0.15);
            box-shadow: inset 0 0 0 2px #bec7dc;
        }
        .cell-related {
            background-color: rgba(255, 255, 255, 0.03);
        }
        .cell:nth-child(3n) { border-right-width: 1.5px; }
        .cell:nth-child(9n) { border-right-width: 1.5px; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom-width: 1.5px;
        }
        .cell-fixed { font-weight: 600; color: #F5F1ED; }
        .cell-input { color: #bec7dc; }
        .cell-error { color: #ffb4ab; }
        
        .numpad-btn {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .numpad-btn:active { transform: scale(0.9); }
        
        /* Notes layout */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 2px;
        }
        .note-num {
            font-size: 8px;
            line-height: 1;
            text-align: center;
        }
    </style>

<script>
        // Simple click interaction for Sudoku Grid
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            cell.addEventListener('click', () => {
                cells.forEach(c => c.classList.remove('cell-active'));
                cell.classList.add('cell-active');
                
                // Subtle haptic-like effect for mobile
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });

        // Numpad interaction
        const numButtons = document.querySelectorAll('.numpad-btn');
        numButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const activeCell = document.querySelector('.cell-active');
                if (activeCell && !activeCell.classList.contains('cell-fixed')) {
                    activeCell.textContent = btn.textContent;
                    activeCell.classList.add('cell-input');
                    
                    // Simple feedback pulse
                    activeCell.animate([
                        { transform: 'scale(1)' },
                        { transform: 'scale(1.1)' },
                        { transform: 'scale(1)' }
                    ], { duration: 150 });
                }
            });
        });
