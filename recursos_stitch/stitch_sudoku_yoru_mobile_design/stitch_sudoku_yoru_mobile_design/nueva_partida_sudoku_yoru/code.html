<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .difficulty-card.active {
            border-color: #70798C;
            background-color: #f2ecec;
            transform: translateY(-2px);
        }
        .difficulty-card.active .icon-container {
            color: #70798C;
        }
        body {
            background-color: #fef8f7;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col text-on-surface">
<!-- Top App Bar -->
<header class="w-full top-0 bg-background dark:bg-background flex justify-between items-center px-margin-mobile py-lg z-50">
<button class="hover:opacity-80 transition-opacity scale-95 duration-200 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="grid_view">grid_view</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface dark:text-on-surface-variant">Sudoku Yoru</h1>
<button class="hover:opacity-80 transition-opacity scale-95 duration-200 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="eco">eco</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow container mx-auto px-margin-mobile pt-xl pb-xxl max-w-lg">
<!-- Title & Subtitle -->
<section class="mb-xl">
<h2 class="font-display-lg text-display-lg mb-xs">Nueva partida</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-70">Elige una dificultad</p>
</section>
<!-- Difficulty Selection Grid -->
<div class="grid grid-cols-1 gap-md">
<!-- Fácil Card -->
<div class="difficulty-card group cursor-pointer transition-all duration-300 bg-surface-container-low border-[0.5px] border-outline-variant rounded-xl p-lg flex items-center gap-lg active:scale-95" onclick="selectDifficulty(this)">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="filter_1">filter_1</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md">Fácil</span>
<span class="font-body-md text-body-md text-on-surface-variant">Relaxed for beginners</span>
</div>
</div>
<!-- Medio Card (Active/Selected by default) -->
<div class="difficulty-card active group cursor-pointer transition-all duration-300 bg-surface-container-low border-[0.5px] border-outline-variant rounded-xl p-lg flex items-center gap-lg active:scale-95" onclick="selectDifficulty(this)">
<div class="icon-container transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="filter_2">filter_2</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md">Medio</span>
<span class="font-body-md text-body-md text-on-surface-variant">A good challenge</span>
</div>
</div>
<!-- Difícil Card -->
<div class="difficulty-card group cursor-pointer transition-all duration-300 bg-surface-container-low border-[0.5px] border-outline-variant rounded-xl p-lg flex items-center gap-lg active:scale-95" onclick="selectDifficulty(this)">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="filter_3">filter_3</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md">Difícil</span>
<span class="font-body-md text-body-md text-on-surface-variant">For trained minds</span>
</div>
</div>
<!-- Experto Card -->
<div class="difficulty-card group cursor-pointer transition-all duration-300 bg-surface-container-low border-[0.5px] border-outline-variant rounded-xl p-lg flex items-center gap-lg active:scale-95" onclick="selectDifficulty(this)">
<div class="icon-container text-on-surface-variant transition-colors">
<span class="material-symbols-outlined text-[32px]" data-icon="bolt">bolt</span>
</div>
<div class="flex flex-col">
<span class="font-title-md text-title-md">Experto</span>
<span class="font-body-md text-body-md text-on-surface-variant">Only for experts</span>
</div>
</div>
</div>
<!-- Start Button -->
<div class="mt-xxl">
<button class="w-full bg-primary text-on-primary py-md rounded-full font-label-lg text-label-lg tracking-widest hover:opacity-90 active:scale-[0.98] transition-all shadow-sm">
                COMENZAR DESAFÍO
            </button>
</div>
<!-- Decorative Illustration Element -->
<div class="mt-xl flex justify-center opacity-20 pointer-events-none">
<img alt="Libro de Sudoku minimalista" class="w-32 h-32 object-cover rounded-full grayscale mix-blend-multiply" data-alt="A clean, minimalist composition of an open, linen-bound notebook on a smooth beige surface. The lighting is soft and natural, coming from a window at dusk, creating long, gentle shadows. Beside the book lies a simple wooden pencil. The color palette is composed of warm whites, soft creams, and charcoal grays, embodying a serene and focused mental state." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDduoIc4fSv5qSmPLPMwDjIm4lHuH-QOk9v6e3dWbX-Bv9zGOKFOvKBq3JRIPgA74zQUqLFjTddh0XE5y952RrxSyZokPrGo7n1LHwLW1YDxIqyCoEWwBEjn_ZW3B5ZL1JZTkiNziaJpVv5ojcUcRfagy9yyJmIgPetqAIR_MuWQ_vInnaOmx6Vqbc2Hca_5GK_OfjWM55m0TTfbjVv4GwTxOzc-qD1VyLW1f9nAa33XiSLm9-sRUiHkUxh-UEBdzj5glqVp07V6LE"/>
</div>
</main>
<!-- Bottom Navigation Bar (Suppressed on this task-focused screen according to shell logic, but included for complete reference to brand anchors if needed. Hidden here to prioritize the difficulty selection flow) -->
<nav class="hidden fixed bottom-0 w-full z-50 pb-safe bg-background border-t-[0.5px] border-outline-variant flex justify-around items-center h-xxl px-xl">
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<div class="flex flex-col items-center justify-center text-primary relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-primary after:rounded-full active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</div>
</nav>
<script>
        function selectDifficulty(element) {
            // Remove active class from all cards
            document.querySelectorAll('.difficulty-card').forEach(card => {
                card.classList.remove('active');
                card.querySelector('.icon-container').classList.add('text-on-surface-variant');
            });
            
            // Add active class to selected card
            element.classList.add('active');
            element.querySelector('.icon-container').classList.remove('text-on-surface-variant');
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }
    </script>
</body></html>
