            transition: all 0.3s ease-in-out;
        }
        input:checked ~ .toggle-bg {
            background-color: #535c6e;
        }
        input:checked ~ .toggle-dot {

<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">

<div class="space-y-px bg-outline-variant/20 rounded-xl overflow-hidden">

</div>

<div class="relative inline-block w-10 h-6">

<script>
        // Simple micro-interaction for toggles
        document.querySelectorAll('input[type="checkbox"]').forEach(toggle => {
            toggle.addEventListener('change', function() {
                if(this.checked) {
                    console.log('Setting enabled');
                    // Add subtle haptic feedback simulation
                } else {
                    console.log('Setting disabled');
                }
            });
        });

        // Toggle Dark Mode Logic (Visual only for demonstration)
        const darkModeToggle = document.querySelector('input[type="checkbox"]');
        darkModeToggle.addEventListener('change', function() {
            if(this.checked) {
                document.documentElement.classList.add('dark');
                // Normally we would update theme-derived colors here
            } else {
                document.documentElement.classList.remove('dark');
            }
        });
    </script>
