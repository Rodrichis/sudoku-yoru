<style>
        body {
            background-color: #F5F1ED; /* Specific Brand Anchor background */
            -webkit-tap-highlight-color: transparent;
        }
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            aspect-ratio: 1 / 1;
            border: 1.5px solid #535c6e;
        }
        .sudoku-cell {
            border: 0.5px solid #c5c6cd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* Thick lines for 3x3 blocks */
        .sudoku-cell:nth-child(3n) { border-right: 1.5px solid #535c6e; }
        .sudoku-cell:nth-child(9n) { border-right: 0.5px solid #c5c6cd; } /* Reset right edge of grid */
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 1.5px solid #535c6e; }
        
        .selected-cell {
            background-color: rgba(213, 196, 174, 0.3); /* secondary-fixed-dim with opacity */
            box-shadow: inset 0 0 0 2px #535c6e;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<script>
        // Simple Sudoku State
        const boardElement = document.getElementById('sudoku-board');
        const initialNumbers = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        let selectedCell = null;
        let isNotesMode = false;

        function createBoard() {
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('sudoku-cell', 'font-grid-number', 'text-grid-number');
                    const val = initialNumbers[r][c];
                    
                    if (val !== 0) {
                        cell.innerText = val;
                        cell.classList.add('text-on-surface', 'font-normal');
                        cell.dataset.fixed = "true";
                    } else {
                        cell.classList.add('text-primary', 'font-light', 'cursor-pointer');
                        cell.addEventListener('click', () => selectCell(cell));
                    }
                    
                    boardElement.appendChild(cell);
                }
            }
        }

        function selectCell(cell) {
            if (selectedCell) {
                selectedCell.classList.remove('selected-cell');
            }
            selectedCell = cell;
            selectedCell.classList.add('selected-cell');
        }

        document.getElementById('notes-toggle').addEventListener('click', () => {
            isNotesMode = !isNotesMode;
            document.getElementById('notes-status').classList.toggle('hidden', !isNotesMode);
        });

        // Keypad Interactions
        document.querySelectorAll('.num-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (selectedCell && !selectedCell.dataset.fixed) {
                    if (isNotesMode) {
                        // Mimic a note in the corner
                        selectedCell.innerHTML = `<span class="absolute top-1 left-1 font-label-sm text-[10px] text-outline">${btn.innerText}</span>`;
                    } else {
                        selectedCell.innerText = btn.innerText;
                        selectedCell.classList.remove('text-error'); // Reset error if any
                    }
                }
            });
        });

        createBoard();
    </script>
